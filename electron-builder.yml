appId: com.spritemagician.app
productName: Sprite Magician
directories:
  output: dist
  buildResources: electron/resources
files:
  - electron/**
  - build/**
  - package.json
  - "!electron/resources/**"
extraResources:
  - from: static/Example images
    to: example-images
  - from: workflows
    to: workflows
asar: true
asarUnpack:
  - build/**
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.graphics-design
linux:
  target:
    - AppImage
  category: Graphics
